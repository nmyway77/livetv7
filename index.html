<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 TV</title>
<meta name="description" content="방송사 공식 스트림을 모아 보는 실시간 TV 샘플 페이지">
<meta property="og:title" content="실시간 TV 샘플">
<meta property="og:type" content="video.other">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --sub:#6b7385; --accent:#e5384f; --line:#e3e6ec; --side:280px; --tabsH:56px; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

  /* 상단 카테고리 탭 */
  .tabs { height:var(--tabsH); display:flex; align-items:center; gap:8px; padding:0 16px; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:none; border:1px solid var(--line); background:var(--card); padding:7px 16px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; }
  .tabs button:hover { border-color:#b9bfcc; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }

  /* 본문: 좌 화면 + 우 채널 */
  .top { height:100%; }
  .wrap { height:calc(100% - var(--tabsH)); display:flex; }
  .stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 14px 8px; }
  .player { position:relative; width:100%; max-width:calc((100vh - var(--tabsH) - 60px) * 16 / 9); aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player iframe, .player video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .player .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:15px; }
  .now { width:100%; max-width:calc((100vh - var(--tabsH) - 60px) * 16 / 9); margin:8px 2px 0; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:20px; }
  /* 방송사 사이트 채널(KBS·MBC·SBS·채널A 등) — PC에서 원래 페이지 전체를 왼쪽 화면 가득 */
  .stage.full { padding:0; justify-content:stretch; }
  .stage.full .player { flex:1; width:100%; max-width:none; aspect-ratio:auto; border-radius:0; background:#fff; }
  .stage.full .player iframe { background:#fff; }
  .stage.full .now { display:none; }
  .now small { color:var(--sub); font-weight:400; margin-left:6px; }

  /* 핸드폰: KBS·MBC·SBS·채널A·TV조선 등 iframe 안 되는 채널 → 화살표 클릭 유도 */
  .tap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#fff; text-decoration:none; background:radial-gradient(circle at 50% 45%, #2a3350 0%, #0d1120 75%); cursor:pointer; }
  .tap .arw { font-size:46px; line-height:1; animation:bob 1s ease-in-out infinite; }
  .tap .ttl { font-size:17px; font-weight:800; }
  .tap .btn { background:var(--accent); padding:10px 20px; border-radius:999px; font-size:14px; font-weight:800; box-shadow:0 0 0 0 rgba(229,56,79,.6); animation:ring 1.6s infinite; }
  .tap .sub { font-size:11.5px; color:#aab2c8; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(9px); } }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(229,56,79,.6); } 70% { box-shadow:0 0 0 14px rgba(229,56,79,0); } 100% { box-shadow:0 0 0 0 rgba(229,56,79,0); } }

  /* 우측 채널 목록 */
  .side { flex:none; width:var(--side); display:flex; flex-direction:column; background:var(--card); border-left:1px solid var(--line); min-height:0; }
  .list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .card { position:relative; flex:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 34px 9px 12px; cursor:pointer; }
  .card:hover { border-color:#b9bfcc; }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .card b { display:block; font-size:14px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { font-size:11.5px; color:var(--sub); }
  .badge { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--accent); padding:1px 5px; border-radius:4px; margin-right:4px; }
  .star { position:absolute; top:50%; right:6px; transform:translateY(-50%); border:0; background:none; font-size:18px; cursor:pointer; color:#c7ccd6; padding:4px; }
  .star.on { color:#f5b301; }
  .notice { flex:none; padding:8px 12px; font-size:10.5px; line-height:1.55; color:#8a91a3; border-top:1px solid var(--line); }
  .notice a { color:#4b5bd6; }

  /* 핸드폰·좁은 화면: 탭+화면 위 고정, 채널은 아래로 스크롤 */
  @media (max-width: 760px) {
    body { overflow:auto; }
    .top { height:auto; position:sticky; top:0; z-index:5; background:var(--bg); }
    .tabs { padding:0 10px; }
    .wrap { height:auto; display:block; }
    .stage { padding:8px 8px 4px; }
    .player, .now { max-width:none; border-radius:8px; }
    .side { width:auto; border-left:0; }
    .list { overflow:visible; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); }
  }

  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
</style>
</head>
<body>
<div class="top">
  <nav class="tabs" id="tabs"></nav>
  <div class="wrap" id="wrap">
    <section class="stage" id="stage">
      <div class="player" id="player"><div class="empty">오른쪽에서 채널을 선택하세요</div></div>
      <div class="now" id="now"></div>
    </section>
  </div>
</div>

const FAV_KEY = "liveTvFavs";
let favs = [];
try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) {}
let currentCat = "전체";
let curSlug = "";
let hls = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 핸드폰·태블릿 판별 — 이 경우만 KBS(공식 플레이어) 채널을 화살표 클릭 유도로 */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|SamsungBrowser/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

/* 좁은 화면이면 채널 목록을 화면 아래로, 넓으면 오른쪽으로 */
const side = document.createElement("aside");
side.className = "side";
side.innerHTML = `<div class="list" id="grid"></div>
  <footer class="notice">ⓘ 방송사가 인터넷에 공개한 <b>공식 스트림·공식 유튜브 채널</b>을 연결해 보여 주는 <b>비영리 개인 사이트</b>입니다. 영상을 저장·재송출하지 않으며 광고·회원가입·수익 활동이 없습니다.
  <b>방송사·권리자의 요청이 있으면 해당 채널을 즉시 삭제합니다.</b> 요청은 <a href="https://github.com/nmyway77/livetv7/issues" target="_blank" rel="noopener">여기(GitHub 이슈)</a>로 남겨 주세요.</footer>`;
function placeSide(){
  const narrow = window.matchMedia("(max-width: 760px)").matches;
  if (narrow) { if (side.parentNode !== document.body) document.body.appendChild(side); }
  else { if (side.parentNode !== $("wrap")) $("wrap").appendChild(side); }
}
placeSide();
window.addEventListener("resize", placeSide);

function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {} }

function renderTabs(){
  const cats = ["전체", "즐겨찾기", ...new Set(CHANNELS.map(c => c.cat))];
  $("tabs").innerHTML = cats.map(c =>
    `<button class="${c===currentCat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}

function renderGrid(){
  const list = CHANNELS.filter(c =>
    currentCat==="전체" ? true : currentCat==="즐겨찾기" ? favs.includes(c.slug) : c.cat===currentCat);
  $("grid").innerHTML = list.map(c => {
    const lk = c.type === "link";
    const badge = lk ? (IS_MOBILE ? '<span class="badge" style="background:#6b7385">LINK</span>' : '<span class="badge">LIVE</span>') : '<span class="badge">LIVE</span>';
    return `<div class="card ${c.slug===curSlug?'on':''}" data-slug="${esc(c.slug)}">
      <button class="star ${favs.includes(c.slug)?'on':''}" data-fav="${esc(c.slug)}" title="즐겨찾기">★</button>
      <b>${esc(c.name)}</b>
      <div class="meta">${badge}${esc(c.cat)}</div>
    </div>`;
  }).join("") || `<p style="color:#888;padding:8px">채널이 없습니다.</p>`;
}

// HLS 모듈은 처음 재생할 때만 불러옴 (지연 로딩)
function loadHlsJs(){
  return new Promise((ok, fail) => {
    if (window.Hls) return ok();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

function stopAll(){
  if (hls) { hls.destroy(); hls = null; }
  const v = $("player").querySelector("video");          // 이전 영상 완전 정지
  if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
}

async function play(slug){
  const c = CHANNELS.find(x => x.slug === slug);
  if (!c) return;
  stopAll();
  curSlug = slug;
  $("stage").classList.toggle("full", c.type === "link" && !IS_MOBILE);
  const box = $("player");
  $("now").innerHTML = `▶ ${esc(c.name)}<small>${esc(c.cat)}</small>`;
  document.title = `${c.name} 실시간 - 실시간 TV`;

  if (c.type === "youtube" || c.type === "youtube-live") {
    const src = c.type === "youtube"
      ? `https://www.youtube.com/embed/${c.id}?autoplay=1&mute=1&playsinline=1`
      : `https://www.youtube.com/embed/live_stream?channel=${c.id}&autoplay=1&mute=1&playsinline=1`;
    box.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  } else if (c.type === "link") {
    if (IS_MOBILE) {            // 핸드폰: 화살표로 클릭 유도 → 공식 플레이어 새 탭
      box.innerHTML = `<a class="tap" href="${esc(c.url)}" target="_blank" rel="noopener">
        <div class="arw">👇</div>
        <div class="ttl">${esc(c.name)}</div>
        <div class="btn">▶ 눌러서 보기 ↗</div>
        <div class="sub">핸드폰에서는 방송사 공식 페이지(새 창)로 열려요</div></a>`;
    } else {                    // PC: 지상파도 화면에서 바로 재생
      box.innerHTML = `<iframe src="${esc(c.url)}" referrerpolicy="no-referrer" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    }
  } else if (c.type === "hls") {
    box.innerHTML = `<video id="v" controls autoplay muted playsinline></video>`;
    const v = $("v");
    try { await loadHlsJs(); } catch(e) {}
    if (c.slug !== curSlug) return;                         // 그 사이 다른 채널을 눌렀으면 중단
    if (window.Hls && Hls.isSupported()) {                 // 크롬·엣지·안드로이드: hls.js
      hls = new Hls({ lowLatencyMode:true });
      hls.on(Hls.Events.ERROR, (ev, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(c.url); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) {   // 아이폰·사파리: 기본 재생
      v.src = c.url;
    } else {
      box.innerHTML = `<div class="empty">이 브라우저는 HLS를 지원하지 않습니다</div>`;
    }
  }
  // 목록의 선택 표시만 바꿈 (화면 스크롤 이동 없음)
  Array.prototype.forEach.call($("grid").querySelectorAll(".card"), el => el.classList.toggle("on", el.dataset.slug === curSlug));
}

// 이벤트
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  currentCat = b.dataset.cat; renderTabs(); renderGrid();
  $("grid").scrollTop = 0;
  if (currentCat === "뉴스") { try { history.replaceState(null, "", "#" + "ytn"); } catch(err) {} play("ytn"); }   // 뉴스 탭 = YTN 바로 재생
});
side.addEventListener("click", e => {
  const f = e.target.closest("[data-fav]");
  if (f) {
    const s = f.dataset.fav;
    favs = favs.includes(s) ? favs.filter(x => x !== s) : [...favs, s];
    saveFavs(); renderGrid(); return;
  }
  const card = e.target.closest(".card");
  if (!card) return;
  const s = card.dataset.slug;
  try { history.replaceState(null, "", "#" + s); } catch(err) {}   // 주소: 페이지#ytn (스크롤 없이)
  play(s);
});
window.addEventListener("hashchange", () => { const s = location.hash.slice(1); if (s && s !== curSlug) play(s); });

renderTabs(); renderGrid();
play(location.hash ? location.hash.slice(1) : "sbs");   // 초기화면 = SBS
</script>
<script>
/* 복사 방지 */
(function(){
  ['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
    document.addEventListener(ev, function(e){ var t=e.target; if(t&&t.closest&&t.closest('input,textarea'))return; e.preventDefault(); }, true);
  });
  document.addEventListener('keydown', function(e){
    var k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
    if (e.key==='F12' || (c&&['u','s','c','x','a'].indexOf(k)>-1) || (c&&e.shiftKey&&['i','j','c'].indexOf(k)>-1)) { e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
</body>
</html>
