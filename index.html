<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 TV</title>
<meta name="description" content="방송사 공식 스트림을 모아 보는 실시간 TV 샘플 페이지">
<meta property="og:title" content="실시간 TV 샘플">
<meta property="og:type" content="video.other">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --sub:#6b7385; --accent:#e5384f; --line:#e3e6ec; --side:280px; --tabsH:56px; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }

  /* 상단 카테고리 탭 */
  .tabs { height:var(--tabsH); display:flex; align-items:center; gap:8px; padding:0 16px; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  /* 가운데 정렬 (넘치면 왼쪽부터 가로 스크롤) */
  .tabs > :first-child { margin-left:auto; }
  .tabs > :last-child { margin-right:auto; }
  .tabs button { flex:none; border:1px solid var(--line); background:var(--card); padding:7px 16px; border-radius:20px; cursor:pointer; font-size:14px; font-weight:600; color:var(--text); white-space:nowrap; }
  .tabs button:hover { border-color:#b9bfcc; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }

  /* 본문: 좌 화면 + 우 채널 */
  .top { height:100%; }
  .wrap { height:calc(100% - var(--tabsH)); display:flex; }
  .stage { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px 14px 8px; }
  .player { position:relative; width:100%; max-width:calc((100vh - var(--tabsH) - 60px) * 16 / 9); aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player iframe, .player video { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .player .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:15px; }
  .now { width:100%; max-width:calc((100vh - var(--tabsH) - 60px) * 16 / 9); margin:8px 2px 0; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:20px; }
  /* 방송사 사이트 채널(KBS·MBC·SBS·채널A 등) — PC에서 원래 페이지 전체를 왼쪽 화면 가득 */
  .stage.full { padding:0; justify-content:stretch; }
  .stage.full .player { flex:1; width:100%; max-width:none; aspect-ratio:auto; border-radius:0; background:#fff; }
  .stage.full .player iframe { background:#fff; }
  .stage.full .now { display:none; }
  .now small { color:var(--sub); font-weight:400; margin-left:6px; }

  /* 핸드폰: KBS·MBC·SBS·채널A·TV조선 등 iframe 안 되는 채널 → 화살표 클릭 유도 */
  .tap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#fff; text-decoration:none; background:radial-gradient(circle at 50% 45%, #2a3350 0%, #0d1120 75%); cursor:pointer; }
  .tap .arw { font-size:46px; line-height:1; animation:bob 1s ease-in-out infinite; }
  .tap .ttl { font-size:17px; font-weight:800; }
  .tap .btn { background:var(--accent); padding:10px 20px; border-radius:999px; font-size:14px; font-weight:800; box-shadow:0 0 0 0 rgba(229,56,79,.6); animation:ring 1.6s infinite; }
  .tap .sub { font-size:11.5px; color:#aab2c8; }
  /* 화면 구석의 작은 [새창] (SBS·채널A·MBC) — 눈에 띄지 않게 */
  .winlink { position:absolute; top:5px; right:5px; z-index:3; padding:3px 8px; border-radius:999px; font-size:10.5px; font-weight:700; line-height:1.4; color:#fff; text-decoration:none; background:rgba(20,24,40,.42); opacity:.6; -webkit-tap-highlight-color:transparent; }
  .winlink:hover, .winlink:active { opacity:1; background:rgba(20,24,40,.8); }
  .tap.start .arw { animation:none; font-size:40px; }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(9px); } }
  @keyframes ring { 0% { box-shadow:0 0 0 0 rgba(229,56,79,.6); } 70% { box-shadow:0 0 0 14px rgba(229,56,79,0); } 100% { box-shadow:0 0 0 0 rgba(229,56,79,0); } }

  /* 우측 채널 목록 */
  .side { flex:none; width:var(--side); display:flex; flex-direction:column; background:var(--card); border-left:1px solid var(--line); min-height:0; }
  .list { flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .card { position:relative; flex:none; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 34px 9px 12px; cursor:pointer; }
  .card:hover { border-color:#b9bfcc; }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .card b { display:block; font-size:14px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { font-size:11.5px; color:var(--sub); }
  .badge { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--accent); padding:1px 5px; border-radius:4px; margin-right:4px; }
  .star { position:absolute; top:50%; right:6px; transform:translateY(-50%); border:0; background:none; font-size:18px; cursor:pointer; color:#c7ccd6; padding:4px; }
  .star.on { color:#f5b301; }
  .notice { flex:none; padding:8px 12px; font-size:10.5px; line-height:1.55; color:#8a91a3; border-top:1px solid var(--line); }
  .notice a { color:#4b5bd6; }

  /* 핸드폰·좁은 화면: 탭+화면 위 고정, 채널은 아래로 스크롤 */
  /* 핸드폰: 화면(.top)은 고정, 채널 목록(.side)만 자체 스크롤 → 채널이 TV 화면 뒤로 사라짐 */
  @media (max-width: 760px) {
    html, body { height:100%; height:100dvh; }
    body { overflow:hidden; display:flex; flex-direction:column; }
    .top { flex:none; height:auto; position:relative; z-index:5; background:var(--bg); box-shadow:0 2px 6px rgba(0,0,0,.06); }
    .side { flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
    .tabs { padding:0 10px; }
    .wrap { height:auto; display:block; }
    .stage { padding:8px 8px 4px; }
    .player, .now { max-width:none; border-radius:8px; }
    .side { width:auto; border-left:0; }
    .list { overflow:visible; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); }
    /* 핸드폰 SBS·채널A: 방송사 페이지를 화면 안에 — 영상 + 상단 메뉴가 보이게 조금 더 높게 */
    .stage.full { padding:8px 8px 4px; }
    .stage.full .player { flex:none; height:min(70vh, calc(56.25vw + 140px)); border-radius:8px; }
  }

  /* SOOP·MLB다시보기 탭: 채널 목록 숨기고 화면 전체 */
  body.wide .side { display:none; }
  body.wide .stage.full .player { border-radius:0; }
  @media (max-width: 760px) {
    body.wide .stage.full { padding:0; }
    body.wide .stage.full .player { height:calc(100dvh - var(--tabsH)); }
  }

  /* OTT 탭: 바로가기 타일 (누르면 새 창) */
  .ott { position:absolute; inset:0; overflow-y:auto; background:var(--bg); padding:28px 24px; }
  .ott h2 { margin:0 auto 16px; max-width:980px; font-size:17px; font-weight:800; }
  .ott h2 small { font-size:12px; color:var(--sub); font-weight:500; margin-left:8px; }
  .ott-grid { max-width:980px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .ott-grid a { display:flex; align-items:center; gap:12px; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.04); transition:transform .15s, box-shadow .15s; }
  .ott-grid a:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.08); border-color:#b9bfcc; }
  .ott-ic { flex:none; width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; font-weight:900; }
  .ott-grid b { display:block; font-size:15px; }
  .ott-grid span { display:block; font-size:11.5px; color:var(--sub); margin-top:2px; }
  .ott-grid i { margin-left:auto; font-style:normal; color:#9aa1b2; font-size:14px; }
  @media (max-width: 760px) {
    body.wide.ottmode .stage.full .player { height:calc(100dvh - var(--tabsH)); }
    .ott { padding:16px 12px; }
    .ott-grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
    .ott-grid a { padding:10px; gap:8px; }
    .ott-ic { width:34px; height:34px; font-size:15px; }
    .ott-grid b { font-size:13.5px; }
  }


  /* ===== 웹드라마 탭: 카드 목록 → 누르면 최신회 재생 + 오른쪽 회차 목록 ===== */
  .wd-list { position:absolute; inset:0; overflow-y:auto; background:#fff; padding:22px 18px 40px; -webkit-overflow-scrolling:touch; }
  .wd-list h2 { max-width:1100px; margin:0 auto 12px; font-size:16px; font-weight:800; letter-spacing:-.3px; }
  .wd-list h2 small { font-size:12px; color:var(--sub); font-weight:500; margin-left:8px; }
  .wd-grid { max-width:1100px; margin:0 auto 26px; display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:12px; }
  .wd-card { position:relative; aspect-ratio:4/3; border-radius:12px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:12px; text-align:center; color:#fff; background:linear-gradient(150deg,var(--c1),var(--c2)); box-shadow:0 2px 8px rgba(0,0,0,.08); transition:transform .18s, box-shadow .18s; }
  .wd-card:hover { transform:translateY(-3px); box-shadow:0 10px 22px rgba(0,0,0,.14); }
  .wd-card b { font-size:17px; font-weight:800; line-height:1.25; word-break:keep-all; text-shadow:0 2px 8px rgba(0,0,0,.18); }
  .wd-card i { font-style:normal; font-size:11.5px; opacity:.92; }
  .wd-card .tg { position:absolute; left:8px; top:8px; font-size:10.5px; font-weight:800; background:rgba(0,0,0,.25); padding:2px 7px; border-radius:999px; }
  .wd-play { position:absolute; inset:0; display:flex; flex-direction:column; background:#fff; }
  .wd-bar { flex:none; display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }
  .wd-back { flex:none; border:0; border-radius:999px; padding:7px 14px; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(95deg,#7ed6fb 10%,#b176f3 90%); cursor:pointer; }
  .wd-mark { flex:none; border:1.5px solid #f5b301; background:#fffaf0; color:#9a6b00; border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .wd-mark.saved { background:#f5b301; color:#fff; }
  .wd-resume { flex:none; font-size:11.5px; color:var(--sub); white-space:nowrap; }
  .wd-resume button { border:0; background:none; color:#4b5bd6; font-weight:700; cursor:pointer; padding:0 2px; font-size:11.5px; }
  .wd-card .mk { position:absolute; right:8px; top:8px; font-size:10.5px; font-weight:800; background:#f5b301; color:#fff; padding:2px 7px; border-radius:999px; }
  .wd-toast { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); background:rgba(20,24,30,.88); color:#fff; padding:8px 14px; border-radius:999px; font-size:12.5px; z-index:5; pointer-events:none; }
  .wd-ttl { flex:1; min-width:0; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wd-ttl small { font-size:12px; color:var(--sub); font-weight:500; margin-left:6px; }
  .wd-body { flex:1; min-height:0; display:flex; }
  .wd-main { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; background:#000; }
  .wd-main .wd-v { position:relative; width:100%; max-height:100%; aspect-ratio:16/9; }
  .wd-main iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .wd-side { flex:none; width:330px; display:flex; flex-direction:column; border-left:1px solid var(--line); min-height:0; }
  .wd-head { flex:none; padding:9px 12px; font-size:13px; font-weight:800; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; }
  .wd-head span { color:var(--sub); font-weight:600; }
  .wd-items { flex:1; overflow-y:auto; padding:6px; }
  .wd-it { display:flex; align-items:center; gap:8px; padding:6px; border-radius:8px; cursor:pointer; }
  .wd-it:hover { background:#f4f6fb; }
  .wd-it.cur { background:#fde8eb; }
  .wd-it .no { flex:none; width:26px; text-align:center; font-size:11.5px; color:var(--sub); font-weight:700; }
  .wd-it img { flex:none; width:96px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:#eee; }
  .wd-it .ti { flex:1; min-width:0; font-size:12.5px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  @media (max-width: 760px) {
    .wd-bar { flex-wrap:wrap; } .wd-ttl { order:3; flex-basis:100%; }
    body.wide.wdmode .stage.full .player { height:calc(100dvh - var(--tabsH)); }
    .wd-list { padding:14px 10px 30px; }
    .wd-grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:9px; }
    .wd-card b { font-size:15px; }
    .wd-body { flex-direction:column; }
    .wd-main { flex:none; }
    .wd-side { width:auto; flex:1; border-left:0; border-top:1px solid var(--line); }
  }

  * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea { -webkit-user-select:text; user-select:text; }
  /* 웹드라마 전용 화면(?wd=1): 채널 탭·목록 없이 화면 전체 */
  /* 웹드라마 카드: 위에 유튜브 썸네일 사진, 아래에 제목 (사진 속 글자와 겹치지 않게) */
  .wd-card.has-th { display:block; aspect-ratio:auto; padding:0; text-align:left; background:#fff; color:var(--text); border:1px solid var(--line); }
  .wd-card.has-th .th { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#ddd; transition:transform .3s; }
  .wd-card.has-th:hover .th { transform:scale(1.04); }
  .wd-card.has-th b { display:block; position:relative; background:#fff; padding:8px 10px 2px; font-size:14.5px; text-shadow:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wd-card.has-th i { display:block; position:relative; background:#fff; padding:0 10px 9px; color:var(--sub); opacity:1; }
  .wd-card .tg, .wd-card .mk { z-index:2; }
  body.wdonly { --tabsH:0px; }
  body.wdonly .tabs { display:none; }
  /* 🔔 새 영상 */
  .feed-btn { margin-left:10px; vertical-align:middle; border:1.5px solid #b9cdf5; background:#eef4ff; color:#2a4fa8; border-radius:999px; padding:5px 12px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; }
  .feed-btn:hover { background:#dfe9ff; }
  .fd-head { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .fd-back { border:0; border-radius:999px; padding:7px 14px; font:inherit; font-size:13px; font-weight:800; color:#fff; background:linear-gradient(95deg,#7ed6fb 10%,#b176f3 90%); cursor:pointer; }
  .fd-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:0 0 14px; } .fd-top .lb { font-size:13px; color:#7a8199; margin-right:4px; }
  .fd-chip { border:1.5px solid #dfe3ec; background:#fff; border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; font-weight:700; color:#4a5170; cursor:pointer; } .fd-chip.on { background:#1f2740; color:#fff; border-color:#1f2740; }
  .fd-st { font-size:13px; color:#7a8199; margin-left:auto; }
  .fd-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .fd-it { cursor:pointer; border-radius:12px; overflow:hidden; background:#fff; box-shadow:0 2px 10px rgba(20,30,60,.07); transition:transform .18s; } .fd-it:hover { transform:translateY(-3px); }
  .fd-it img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#eee; }
  .fd-it .tx { padding:8px 10px 10px; } .fd-it b { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; font-size:13.5px; line-height:1.35; color:#1f2740; }
  .fd-it small { display:block; margin-top:5px; font-size:12px; color:#7a8199; } .fd-empty { padding:40px 0; text-align:center; color:#7a8199; }
  @media (max-width:600px){ .fd-grid { grid-template-columns:repeat(2, minmax(0,1fr)); gap:9px; } .fd-it b { font-size:12.5px; } }
  /* ⛶ 크게 보기 */
  html.is-ios .big-btn { display:none !important; }
  .big-btn { flex:none; border:1.5px solid #dfe3ec; background:#fff; color:#1f2740; border-radius:999px; padding:6px 12px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; }
  :fullscreen.bigable, :-webkit-full-screen.bigable { background:#000 !important; display:flex !important; align-items:center; justify-content:center; width:100vw; height:100vh; }
  .bigable.big-fill { position:fixed !important; inset:0 !important; z-index:9999 !important; background:#000 !important; display:flex !important; align-items:center; justify-content:center; }
  .big-x { position:absolute; top:10px; right:10px; z-index:2; border:0; color:#fff; background:rgba(0,0,0,.6); padding:7px 13px; border-radius:999px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
  :fullscreen.bigable > :not(.big-x), .bigable.big-fill > :not(.big-x) { max-height:100%; width:100%; }
</style>
</head>
<body>
<div class="top">
  <nav class="tabs" id="tabs"></nav>
  <div class="wrap" id="wrap">
    <section class="stage" id="stage">
      <div class="player" id="player"><div class="empty">오른쪽에서 채널을 선택하세요</div></div>
      <div class="now" id="now"></div>
    </section>
  </div>

/* 핸드폰·태블릿 판별 — 이 경우만 KBS(공식 플레이어) 채널을 화살표 클릭 유도로 */
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|SamsungBrowser/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
/* 핸드폰만 판별 (태블릿·아이패드 제외) — KBS는 태블릿에서는 화면 안 재생이 되므로 핸드폰에서만 화살표 */
const IS_PHONE = /iPhone|iPod/i.test(navigator.userAgent) || (/Android/i.test(navigator.userAgent) && /Mobile/i.test(navigator.userAgent));

/* 좁은 화면이면 채널 목록을 화면 아래로, 넓으면 오른쪽으로 */
const side = document.createElement("aside");
side.className = "side";
side.innerHTML = `<div class="list" id="grid"></div>
  <footer class="notice">ⓘ 방송사가 인터넷에 공개한 <b>공식 스트림·공식 유튜브 채널</b>을 연결해 보여 주는 <b>비영리 개인 사이트</b>입니다. 영상을 저장·재송출하지 않으며 광고·회원가입·수익 활동이 없습니다.
  <b>방송사·권리자의 요청이 있으면 해당 채널을 즉시 삭제합니다.</b> 요청은 <a href="https://github.com/nmyway77/livetv7/issues" target="_blank" rel="noopener">여기(GitHub 이슈)</a>로 남겨 주세요.</footer>`;
function placeSide(){
  const narrow = window.matchMedia("(max-width: 760px)").matches;
  if (narrow) { if (side.parentNode !== document.body) document.body.appendChild(side); }
  else { if (side.parentNode !== $("wrap")) $("wrap").appendChild(side); }
}
placeSide();
window.addEventListener("resize", placeSide);

/* 즐겨찾기 보관: myway.kr 안에서 열리면 myway.kr(부모 페이지) 저장소에 보관
   → 이 페이지는 다른 주소(github.io)라 핸드폰 브라우저가 껐다 켜면 지우는 경우가 있어서. 단독으로 열면 여기 저장소 사용 */
const FAV_PARENTS = ["https://myway.kr", "https://www.myway.kr"];
const IN_FRAME = (() => { try { return window.parent !== window; } catch(e) { return true; } })();
function toParent(msg){ if (!IN_FRAME) return; FAV_PARENTS.forEach(o => { try { window.parent.postMessage(msg, o); } catch(e) {} }); }
function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {} toParent({ type:"LIVETV_FAVS_SET", favs: favs }); }
window.addEventListener("message", e => {
  if (!FAV_PARENTS.includes(e.origin)) return;
  const d = e.data; if (!d || d.type !== "LIVETV_FAVS") return;
  if (Array.isArray(d.favs)) {
    favs = d.favs.filter(x => typeof x === "string");
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(err) {}
    if (typeof renderGrid === "function") renderGrid();
  } else if (favs.length) toParent({ type:"LIVETV_FAVS_SET", favs: favs });   // 부모에 아직 없으면 여기 것을 처음 한 번 옮겨 둠
});
toParent({ type:"LIVETV_FAVS_GET" });
/* 웹드라마 '여기까지 봄' 표시 — 버튼을 눌렀을 때만 저장 (자동 저장 없음). 핸드폰에서 지워지지 않게 myway.kr 저장소에도 함께 보관 */
const MARK_KEY = "liveTvWdMarksV1";
let wdMarks = {};
try { wdMarks = JSON.parse(localStorage.getItem(MARK_KEY)) || {}; } catch(e) {}
function saveMarks(){ try { localStorage.setItem(MARK_KEY, JSON.stringify(wdMarks)); } catch(e) {} toParent({ type:"LIVETV_MARKS_SET", marks: wdMarks }); }
window.addEventListener("message", e => {
  if (!FAV_PARENTS.includes(e.origin)) return;
  const d = e.data; if (!d || d.type !== "LIVETV_MARKS") return;
  if (d.marks && typeof d.marks === "object") { wdMarks = Object.assign({}, d.marks, wdMarks); try { localStorage.setItem(MARK_KEY, JSON.stringify(wdMarks)); } catch(err) {} }
  else if (Object.keys(wdMarks).length) toParent({ type:"LIVETV_MARKS_SET", marks: wdMarks });
});
toParent({ type:"LIVETV_MARKS_GET" });

/* 상단 탭: 스포츠·인터넷방송·지역·종교·키즈·라이프·캠 탭은 숨김 (채널은 '전체'에 그대로)
   그 자리에 채널 바로가기 탭 [SOOP] [MLB다시보기] [치지직] → 누르면 그 채널 화면 바로. [해외]는 지상파 바로 오른쪽 */
const HIDE_CATS = ["스포츠", "인터넷방송", "지역", "종교", "키즈", "라이프·캠", "해외"];
const WIDE_TABS = ["@soop", "@mlb", "@tvgarden", "OTT", "웹드라마"];   // 이 탭은 채널 목록 없이 화면 전체 (SOOP·MLB다시보기·TV Garden·OTT)
const DIRECT_TABS = [["SOOP", "soop"], ["MLB다시보기", "mlb"], ["치지직", "chzzk"], ["트위치", "twitch"], ["TV Garden", "tvgarden"]];
/* OTT 탭: 누르면 화면에 OTT 바로가기 타일 → 각 타일은 새 창으로 열림 */
const OTT_LIST = [
  ["넷플릭스", "netflix.com", "https://www.netflix.com/kr/", "N", "#e50914,#8b0610"],
  ["쿠팡플레이", "coupangplay.com", "https://www.coupangplay.com/", "C", "#7b2ff7,#c13cf0"],
  ["디즈니+", "disneyplus.com", "https://www.disneyplus.com/ko-kr", "D+", "#0b3d91,#1fb5c9"],
  ["티빙", "tving.com", "https://www.tving.com/", "T", "#ff153c,#ff6a3d"],
  ["웨이브", "wavve.com", "https://www.wavve.com/", "W", "#1351f9,#3fa3ff"],
  ["왓챠", "watcha.com", "https://watcha.com/", "W", "#ff0558,#ff4d8a"],
  ["Apple TV+", "tv.apple.com", "https://tv.apple.com/kr", "tv", "#1d1d1f,#555"],
  ["프라임 비디오", "primevideo.com", "https://www.primevideo.com/", "P", "#00a8e1,#146eb4"],
  ["라프텔", "laftel.net · 애니", "https://laftel.net/", "L", "#816bff,#b49cff"],
  ["유튜브", "youtube.com", "https://www.youtube.com/", "▶", "#ff0000,#c4302b"]
];
const dirSlug = cat => (cat && cat.charAt(0) === "@") ? cat.slice(1) : "";
function inCat(c){
  const d = dirSlug(currentCat);
  if (d) { const t = CHANNELS.find(x => x.slug === d); return !!t && c.cat === t.cat; }   // 바로가기 탭: 그 채널이 속한 분류 목록
  return currentCat==="전체" ? true : currentCat==="즐겨찾기" ? favs.includes(c.slug) : c.cat===currentCat;
}
const MOB_INLINE = /sbs\.co\.kr|imbc\.com|ichannela\.com|jtbc\.co\.kr|sooplive\.co\.kr|tv\.garden|mlblive\.net/i;   // SBS·채널A·SOOP·TV Garden·MLB다시보기는 핸드폰에서도 화면 안에서 바로 재생
const ARROW_SLUGS = ["arirang"];   // PC·핸드폰 모두 화살표(별도 창): 아리랑TV (MLB다시보기는 화면 안 재생으로 변경)
/* 핸드폰 KBS: 공식 화면이 화면 안에 안 떠서 화살표(새 창)였던 채널 → 방송 주소를 받아 화면 안에서 바로 재생 (마이웨이 KBS 보이는 라디오와 같은 방식).
   주소를 못 받거나 재생이 안 되는 채널은 그때만 예전처럼 화살표로 되돌림. 태블릿·PC는 공식 화면이 화면 안에 잘 나오므로 그대로 */
const kbsFail = new Set();
const kbsCode = c => { const m = c.type === "link" && !c.newwin && /onair\.kbs\.co\.kr/i.test(c.url) && c.url.match(/[?&]ch_code=([\w-]+)/); return m ? m[1] : ""; };
const kbsDirect = c => IS_PHONE && !kbsFail.has(c.slug) && !!kbsCode(c);
const KBS_SILENT = 'data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';   // 아이폰은 누른 순간 재생을 시작해야 소리를 허용 → 주소를 받는 동안 아주 짧은 무음을 먼저 틂
function playKbs(c, noAuto){
  const box = $("player"), slug = c.slug;
  box.innerHTML = `<video id="v" controls playsinline webkit-playsinline></video>`;
  const v = $("v"); let started = false;
  const real = () => { const u = String(v.currentSrc || v.getAttribute("src") || ""); return !!u && u.indexOf("data:") !== 0; };
  const alive = () => curSlug === slug && v.isConnected;
  const fail = () => { if (started || !alive()) return; kbsFail.add(slug); play(slug, true); };   // 안 되는 채널 → 화살표 안내로
  if (!noAuto) { try { v.src = KBS_SILENT; const p0 = v.play(); if (p0 && p0.catch) p0.catch(() => {}); } catch(e) {} }
  v.addEventListener("playing", () => { if (real()) started = true; });
  v.addEventListener("error", () => { if (real()) fail(); });
  fetch("https://cfpwwwapi.kbs.co.kr/api/v1/landing/live/channel_code/" + encodeURIComponent(kbsCode(c)), { cache:"no-store" })
    .then(r => { if (!r.ok) throw new Error("http"); return r.json(); })
    .then(async d => {
      if (!alive()) return;
      const items = ((d && d.channel_item) || []).filter(it => it && it.service_url);
      const pick = items.find(it => /tv/i.test(String(it.media_type || ""))) || items.find(it => !/radio/i.test(String(it.media_type || ""))) || items[0];
      if (!pick) { fail(); return; }
      const url = String(pick.service_url).replace(/^http:/, "https:");
      try { await loadHlsJs(); } catch(e) {}
      if (!alive()) return;
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.on(Hls.Events.ERROR, (ev, e) => {
          if (!e || !e.fatal) return;
          if (!started) fail();
          else if (e.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (e.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        });
        hls.loadSource(url); hls.attachMedia(v);
      } else { v.src = url; }
      if (!noAuto) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    })
    .catch(fail);
}
const isExt = c => c.type === "link" && !kbsDirect(c) && (!!c.newwin || ARROW_SLUGS.includes(c.slug) || (IS_MOBILE && !MOB_INLINE.test(c.url) && !(!IS_PHONE && /kbs\.co\.kr/i.test(c.url))));   // 화살표(별도 창) 채널: 치지직·MBC·TV조선, 핸드폰 KBS 등
function renderTabs(){
  document.body.classList.toggle("wide", WIDE_TABS.includes(currentCat));
  document.body.classList.toggle("ottmode", currentCat === "OTT");
  document.body.classList.toggle("wdmode", currentCat === "웹드라마");
  const cats = ["전체", "즐겨찾기", ...new Set(CHANNELS.map(c => c.cat))].filter(c => !HIDE_CATS.includes(c));
  const btn = (cat, label) => `<button class="${cat===currentCat?'on':''}" data-cat="${esc(cat)}">${esc(label)}</button>`;
  const abroad = CHANNELS.some(c => c.cat === "해외") ? btn("해외", "해외") : "";
  $("tabs").innerHTML = cats.map(c => btn(c, c) + (c === "지상파" ? abroad + btn("OTT", "OTT") : "") ).join("")   // 지상파 오른쪽에 해외, 그다음 OTT
    + DIRECT_TABS.filter(d => CHANNELS.some(c => c.slug === d[1])).map(d => btn("@" + d[1], d[0])).join("");
}
function showOtt(){
  stopAll(); closePop(); curSlug = "";
  $("stage").classList.add("full");
  $("now").innerHTML = "";
  document.title = "OTT 바로가기 - 실시간 TV";
  $("player").innerHTML = `<div class="ott"><h2>OTT 바로가기<small>누르면 새 창으로 열려요</small></h2><div class="ott-grid">`
    + OTT_LIST.map(o => `<a href="${esc(o[2])}" target="_blank" rel="noopener"><div class="ott-ic" style="background:linear-gradient(135deg,${o[4]})">${esc(o[3])}</div><div><b>${esc(o[0])}</b><span>${esc(o[1])}</span></div><i>↗</i></a>`).join("")
    + `</div></div>`;
}

function renderGrid(){
  const list = CHANNELS.filter(inCat);
  $("grid").innerHTML = list.map(c => {
    const lk = c.type === "link";
    const badge = lk ? (isExt(c) ? '<span class="badge" style="background:#6b7385">LINK</span>' : '<span class="badge">LIVE</span>') : '<span class="badge">LIVE</span>';
    return `<div class="card ${c.slug===curSlug?'on':''}" data-slug="${esc(c.slug)}">
      <button class="star ${favs.includes(c.slug)?'on':''}" data-fav="${esc(c.slug)}" title="즐겨찾기">★</button>
      <b>${esc(c.name)}</b>
      <div class="meta">${badge}${esc(c.cat)}</div>
    </div>`;
  }).join("") || `<p style="color:#888;padding:8px">채널이 없습니다.</p>`;
}

// HLS 모듈은 처음 재생할 때만 불러옴 (지연 로딩)
function loadHlsJs(){
  return new Promise((ok, fail) => {
    if (window.Hls) return ok();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

/* ── PC: 별도 창 채널(MBC 새창·TV조선 등)은 새 탭 대신 '화면 자리에 딱 맞는 작은 창'으로 바로 띄움 ──
   채널을 누르는 순간 재생 화면 위에 창이 뜨고, 다른 별도 창 채널을 누르면 같은 창에서 바뀌며,
   화면 안 재생 채널로 넘어가거나 TV를 떠나면 창이 닫힘. (핸드폰은 창 크기를 정할 수 없어 기존 방식 그대로) */
let pop = null, lastPt = null;
document.addEventListener("pointerdown", e => { lastPt = { x: e.screenX - e.clientX, y: e.screenY - e.clientY }; }, true);   // 이 화면이 모니터의 어디에 있는지(누른 위치로 계산)
function popSpec(){
  const r = $("player").getBoundingClientRect();
  const ox = lastPt ? lastPt.x : (window.screenX || 0), oy = lastPt ? lastPt.y : (window.screenY || 0) + 90;
  const w = Math.max(520, Math.round(r.width)), h = Math.max(320, Math.round(r.height) - 66);   // 창 제목·주소줄 높이만큼 뺌
  return `popup=yes,left=${Math.round(ox + r.left)},top=${Math.round(oy + r.top)},width=${w},height=${h}`;
}
/* 화살표(별도 창) 안내 화면 */
function tapHtml(c, popped){
  return `<a class="tap" href="${esc(c.url)}" target="_blank" rel="noopener"${c.newtab ? ' data-newtab="1"' : ""}>
        <div class="arw">👇</div>
        <div class="ttl">${esc(c.name)}</div>
        <div class="btn">${popped ? "▶ 창 다시 띄우기 ↗" : "▶ 눌러서 보기 ↗"}</div>
        <div class="sub">${!IS_MOBILE ? (popped ? "화면 위에 별도 창으로 재생 중 — 다른 채널을 누르면 창이 닫혀요" : "누르면 화면 자리에 별도 창으로 열려요") : c.newtab && IS_MOBILE ? "새 탭으로 열려요 — 뒤로가기를 끝까지 누르거나 그 탭을 닫으면 돌아와요" : IS_MOBILE ? "핸드폰에서는 방송사 공식 페이지(새 창)로 열려요" : "이 채널은 방송사가 화면 안 재생을 막아 별도 창으로 열려요"}</div></a>`;
}
/* SBS·채널A·MBC: 화면 안 재생은 미리보기(로그인 필요)라서 → 화면 구석에 작게 [새창] */
const WIN_LINK = /sbs\.co\.kr|ichannela\.com|imbc\.com/i;
function openPop(c){
  try {
    if (pop && !pop.closed) { pop.location.href = c.url; try { pop.focus(); } catch(e) {} return true; }   // 열려 있는 창에서 채널만 바꿈
    pop = window.open("", "mywayTvPop", popSpec());
    if (!pop) return false;                         // 팝업이 막힌 브라우저 → 화면의 [눌러서 보기]로
    pop.location.href = c.url;   // (opener를 끊으면 이후 이 창의 채널을 바꾸거나 닫을 수 없게 되므로 끊지 않음)
    return true;
  } catch(e) { pop = null; return false; }
}
function closePop(){ try { if (pop && !pop.closed) pop.close(); } catch(e) {} pop = null; }
window.addEventListener("pagehide", closePop);

function stopAll(){
  if (wdPlayer) { try { wdPlayer.destroy(); } catch(e) {} wdPlayer = null; }
  if (hls) { hls.destroy(); hls = null; }
  const v = $("player").querySelector("video");          // 이전 영상 완전 정지
  if (v) { v.pause(); v.removeAttribute("src"); v.load(); }
}

async function play(slug, noAuto){   // noAuto: 처음 열 때 — 화면은 그대로 띄우고 재생만 안 함
  const c = CHANNELS.find(x => x.slug === slug);
  if (!c) return;
  stopAll();
  curSlug = slug;
  const ext = isExt(c);   // 핸드폰(KBS 등), 또는 임베드 막힌 채널(MBC·TV조선) → 별도 창
  if (!ext || IS_MOBILE) closePop();   // 화면 안 재생 채널로 넘어가면 떠 있던 별도 창은 닫음
  $("stage").classList.toggle("full", c.type === "link" && !ext);
  const box = $("player");
  $("now").innerHTML = `▶ ${esc(c.name)}<small>${esc(c.cat)}</small>`;
  document.title = `${c.name} 실시간 - 실시간 TV`;

  if (kbsDirect(c)) {            // 핸드폰 KBS: 새 창 없이 화면 안에서 바로 재생
    $("stage").classList.remove("full");
    playKbs(c, noAuto);
  } else if (c.type === "youtube" || c.type === "youtube-live") {
    const src = c.type === "youtube"
      ? `https://www.youtube.com/embed/${c.id}?autoplay=1&mute=1&playsinline=1`
      : `https://www.youtube.com/embed/live_stream?channel=${c.id}&autoplay=1&mute=1&playsinline=1`;
    const src2 = noAuto ? src.replace("autoplay=1&mute=1&", "autoplay=0&") : src;
    box.innerHTML = `<iframe src="${src2}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  } else if (c.type === "link") {
    if (ext) {                  // 화살표로 클릭 유도 → 방송사 공식 페이지 별도 창
      const popped = !IS_MOBILE && !noAuto && openPop(c);   // PC: 채널을 누르면 화면 자리에 창이 바로 뜸
      box.innerHTML = tapHtml(c, popped);
    } else {                    // PC: 지상파도 화면에서 바로 재생 (핸드폰은 SBS·채널A만) — SBS·채널A는 앱 확인창 차단(sandbox)
      box.innerHTML = `<iframe src="${esc(c.url)}"${/sbs\.co\.kr|ichannela\.com/i.test(c.url) ? ' sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-presentation"' : ""} referrerpolicy="no-referrer" allow="${/imbc\.com/i.test(c.url) ? "fullscreen" : "autoplay; encrypted-media; picture-in-picture; fullscreen"}" allowfullscreen></iframe>${WIN_LINK.test(c.url) ? `<a class="winlink" href="${esc(c.url)}" target="_blank" rel="noopener" title="새 창에서 보기 (로그인해서 계속 볼 때)">새창 ↗</a>` : ""}`;   // MBC는 allow를 fullscreen만 줘야 화면 안에서 나옴 (테스트로 확인)
    }
  } else if (c.type === "hls") {
    box.innerHTML = `<video id="v" controls autoplay muted playsinline></video>`;
    const v = $("v");
    try { await loadHlsJs(); } catch(e) {}
    if (c.slug !== curSlug) return;                         // 그 사이 다른 채널을 눌렀으면 중단
    if (window.Hls && Hls.isSupported()) {                 // 크롬·엣지·안드로이드: hls.js
      hls = new Hls({ lowLatencyMode:true });
      hls.on(Hls.Events.ERROR, (ev, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(c.url); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) {   // 아이폰·사파리: 기본 재생
      v.src = c.url;
    } else {
      box.innerHTML = `<div class="empty">이 브라우저는 HLS를 지원하지 않습니다</div>`;
    }
  }
  // 목록의 선택 표시만 바꿈 (화면 스크롤 이동 없음)
  Array.prototype.forEach.call($("grid").querySelectorAll(".card"), el => el.classList.toggle("on", el.dataset.slug === curSlug));
}

// 이벤트
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  currentCat = b.dataset.cat; renderTabs(); renderGrid();
  $("grid").scrollTop = 0; side.scrollTop = 0;
  if (currentCat === "OTT") { try { history.replaceState(null, "", location.pathname + location.search); } catch(err) {} showOtt(); return; }
  if (currentCat === "웹드라마") { try { history.replaceState(null, "", location.pathname + location.search); } catch(err) {} showWebdrama(); return; }
  // 탭(지상파·뉴스…)을 누르면 그 탭의 첫 채널이 바로 재생 (뉴스 = YTN), 바로가기 탭은 그 채널
  const first = dirSlug(currentCat) ? CHANNELS.find(c => c.slug === dirSlug(currentCat)) : CHANNELS.find(inCat);
  if (first) { try { history.replaceState(null, "", "#" + first.slug); } catch(err) {} play(first.slug); }
});
side.addEventListener("click", e => {
  const f = e.target.closest("[data-fav]");
  if (f) {
    const s = f.dataset.fav;
    favs = favs.includes(s) ? favs.filter(x => x !== s) : [...favs, s];
    saveFavs(); renderGrid(); return;
  }
  const card = e.target.closest(".card");
  if (!card) return;
  const s = card.dataset.slug;
  try { history.replaceState(null, "", "#" + s); } catch(err) {}   // 주소: 페이지#ytn (스크롤 없이)
  play(s);
});
window.addEventListener("hashchange", () => { const s = location.hash.slice(1); if (s && s !== curSlug) play(s); });


// 처음 열었을 때의 정지 화면: 채널을 고르거나 ▶를 누르기 전에는 아무것도 재생하지 않음
function showStart(slug){
  const c = CHANNELS.find(x => x.slug === slug); if (!c) return;
  curSlug = "";
  $("now").innerHTML = `▶ 채널을 선택하세요<small>${esc(c.cat)}</small>`;
  $("player").innerHTML = `<a class="tap start" href="#${esc(c.slug)}" data-start="${esc(c.slug)}">
    <div class="arw">▶</div>
    <div class="ttl">${esc(c.name)} 실시간</div>
    <div class="btn">▶ 눌러서 보기</div>
    <div class="sub">오른쪽 목록에서 다른 채널을 골라도 바로 재생돼요</div></a>`;
}
$("player").addEventListener("click", e => {
  const a = e.target.closest("a.start"); if (!a) return;
  e.preventDefault();
  try { history.replaceState(null, "", "#" + a.dataset.start); } catch(err) {}

var HIST = [], HIST_POP = false;   /* [{ back, live, pushed, tag }] */
function histOpen(back, isOpen, tag){

});

/* ===== 🔔 새 영상: 누를 때만 각 채널의 최근 영상(유튜브 RSS, rss2json 경유)을 모아 날짜순으로 — 쇼츠 제외 ===== */
function makeFeed(opt){
  /* opt: { box, sources:[{q:'channel_id=UC..'|'playlist_id=PL..', name}], onPick(list, k) } */
  let FEED = null, days = 3, loading = false;
  const ta = document.createElement("textarea"); const unesc = s => { ta.innerHTML = String(s); return ta.value; };
  const ago = d => { const m = Math.floor((Date.now() - d) / 60000); if (m < 60) return Math.max(1, m) + "분 전"; const h = Math.floor(m / 60); if (h < 24) return h + "시간 전"; return Math.floor(h / 24) + "일 전"; };
  function render(st){
    const box = opt.box; if (!box) return; const D = [[1, "24시간"], [3, "3일"], [7, "7일"]];
    const list = (FEED || []).filter(x => Date.now() - x.d <= days * 86400000);
    box.innerHTML = `<div class="fd-top"><span class="lb">올라온 지</span>` + D.map(d => `<button type="button" class="fd-chip${d[0] === days ? " on" : ""}" data-d="${d[0]}">${d[1]}</button>`).join("")
      + `<button type="button" class="fd-chip fd-re">↻ 다시 불러오기</button><span class="fd-st">${st || (list.length + "개 · 쇼츠 제외")}</span></div><div class="fd-grid"></div>`;
    box.querySelectorAll(".fd-chip[data-d]").forEach(b => b.onclick = () => { days = +b.dataset.d; render(); });
    box.querySelector(".fd-re").onclick = () => { FEED = null; load(); };
    const g = box.querySelector(".fd-grid");
    if (FEED && !list.length) { g.outerHTML = `<div class="fd-empty">이 기간에 올라온 새 영상이 없어요</div>`; return; }
    list.forEach((x, k) => {
      const it = document.createElement("div"); it.className = "fd-it";
      it.innerHTML = `<img loading="lazy" alt="" src="https://i.ytimg.com/vi/${x.v}/mqdefault.jpg"><div class="tx"><b></b><small></small></div>`;
      it.querySelector("b").textContent = x.t; it.querySelector("small").textContent = x.ch + " · " + ago(x.d);
      it.onclick = () => opt.onPick(list, k); g.appendChild(it);
    });
  }
  function one(s, tries){
    return fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent("https://www.youtube.com/feeds/videos.xml?" + s.q))
      .then(r => r.json()).then(j => {
        if (j.status !== "ok") { if ((tries || 0) < 3) return new Promise(ok => setTimeout(ok, 2500 * ((tries || 0) + 1))).then(() => one(s, (tries || 0) + 1)); return []; }
        return (j.items || []).filter(i => !/\/shorts\//.test(i.link || "")).map(i => {
          const m = String(i.link || "").match(/[?&]v=([\w-]{11})/); const d = Date.parse(String(i.pubDate || "").replace(" ", "T") + "Z");
          return (m && !isNaN(d)) ? { v: m[1], t: unesc(i.title || ""), ch: s.name, d } : null; }).filter(Boolean);
      }).catch(() => []);
  }
  function load(){
    if (FEED) { render(); return; }
    if (loading) return; loading = true;
    const srcs = opt.sources; let k = 0, done = 0; const out = [], seen = {};
    render("불러오는 중… 0/" + srcs.length);
    const worker = () => { if (k >= srcs.length) return Promise.resolve(); const s = srcs[k++];
      return one(s).then(a => { a.forEach(x => { if (!seen[x.v]) { seen[x.v] = 1; out.push(x); } }); done++; const st = opt.box && opt.box.querySelector(".fd-st"); if (st && !FEED) st.textContent = "불러오는 중… " + done + "/" + srcs.length; return worker(); }); };
    Promise.all([worker(), worker(), worker(), worker()]).then(() => { out.sort((a, b) => b.d - a.d); FEED = out; loading = false; render(); });
  }
  return { load };
}

else if (retSlug) play(retSlug);   // 화살표 채널로 나갔다가 백버튼으로 돌아온 경우만 → 그 채널 바로 재생
else {
  /* 처음 열 때는 항상 정지 화면. 주소 끝에 남은 #채널(새로고침·뒤로가기 때 브라우저가 되살린 값)로는 자동 재생하지 않음 */
  try { history.replaceState(null, "", location.pathname + location.search); } catch(err) {}
  play("ytn", true);   // 처음 화면: 원래 YTN 유튜브 화면 그대로, 자동 재생만 안 함 (▶ 누르면 재생) — 탭·다른 채널을 누르면 바로 자동 재생
}   // 처음 연 사람: 자동 재생하지 않고 정지 화면(▶ 눌러서 보기) — 누르면 YTN, 다른 채널을 누르면 그 채널이 바로 재생
</script>
<script>
/* 복사 방지 */
(function(){
  ['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(ev){
    document.addEventListener(ev, function(e){ var t=e.target; if(t&&t.closest&&t.closest('input,textarea'))return; e.preventDefault(); }, true);
  });
  document.addEventListener('keydown', function(e){
    var k=(e.key||'').toLowerCase(), c=e.ctrlKey||e.metaKey;
    if (e.key==='F12' || (c&&['u','s','c','x','a'].indexOf(k)>-1) || (c&&e.shiftKey&&['i','j','c'].indexOf(k)>-1)) { e.preventDefault(); e.stopPropagation(); }
  }, true);
})();
</script>
<script>
/* 모바일: 새 창(새 탭) 대신 최상위 창에서 직접 열어 → 백버튼으로 MYWAY 복귀. PC·태블릿은 새 탭 유지. */
(function(){
  if(!/Mobi/i.test(navigator.userAgent)) return;
  function skip(u){ return !u || u.charAt(0) === '#' || /^(javascript|blob|data|mailto|tel|about):/i.test(u); }
  function go(u){ try { (window.top || window).location.href = u; } catch(_) { location.href = u; } }
  document.addEventListener('click', function(e){
    if (e.defaultPrevented || document.body.classList.contains('editing')) return;
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || a.hasAttribute('download') || a.hasAttribute('data-newtab')) return;
    var href = a.getAttribute('href') || '';
    if (skip(href) || skip(a.href)) return;
    e.preventDefault(); go(a.href);
  });
  var _open = window.open;
  window.open = function(url){
    if (typeof url === 'string' && !skip(url)) { go(new URL(url, location.href).href); return null; }
    return _open.apply(window, arguments);
  };
})();
</script>
