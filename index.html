<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 TV</title>
<meta name="description" content="방송사 공식 스트림을 모아 보는 실시간 TV 샘플 페이지">
<meta property="og:title" content="실시간 TV 샘플">
<meta property="og:type" content="video.other">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2433; --sub:#6b7385; --accent:#e5384f; --line:#e3e6ec; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); font-weight:700; font-size:18px; }
  header span { color:var(--accent); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player iframe, .player video { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .player .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#aaa; }
  .now { margin:10px 2px 18px; font-weight:600; }
  .now small { color:var(--sub); font-weight:400; margin-left:6px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .tabs button { border:1px solid var(--line); background:var(--card); padding:6px 14px; border-radius:20px; cursor:pointer; font-size:14px; }
  .tabs button.on { background:var(--text); color:#fff; border-color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
  .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 12px; cursor:pointer; }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .card b { display:block; font-size:15px; margin-bottom:4px; }
  .card .meta { font-size:12px; color:var(--sub); }
  .badge { display:inline-block; font-size:10px; font-weight:700; color:#fff; background:var(--accent); padding:1px 5px; border-radius:4px; margin-right:4px; }
  .star { position:absolute; top:8px; right:8px; border:0; background:none; font-size:18px; cursor:pointer; color:#c7ccd6; }
  .star.on { color:#f5b301; }
</style>
</head>

<header>📺 실시간<span>TV</span></header>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

const FAV_KEY = "liveTvFavs";
let favs = [];
try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) {}
let currentCat = "전체";
let hls = null;

const $ = id => document.getElementById(id);

function saveFavs(){ try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) {} }

function renderTabs(){
  const cats = ["전체", "즐겨찾기", ...new Set(CHANNELS.map(c => c.cat))];
  $("tabs").innerHTML = cats.map(c =>
    `<button class="${c===currentCat?'on':''}" data-cat="${c}">${c}</button>`).join("");
}

function renderGrid(){
  const cur = location.hash.slice(1);
  const list = CHANNELS.filter(c =>
    currentCat==="전체" ? true : currentCat==="즐겨찾기" ? favs.includes(c.slug) : c.cat===currentCat);
  $("grid").innerHTML = list.map(c => `
    <div class="card ${c.slug===cur?'on':''}" data-slug="${c.slug}">
      <button class="star ${favs.includes(c.slug)?'on':''}" data-fav="${c.slug}">★</button>
      <b>${c.name}</b>
      <div class="meta"><span class="badge" style="${c.type==='link'?'background:#6b7385':''}">${c.type==='link'?'LINK':'LIVE'}</span>${c.cat}</div>
    </div>`).join("") || `<p style="color:#888">채널이 없습니다.</p>`;
}

// HLS 모듈은 처음 재생할 때만 불러옴 (지연 로딩)
function loadHlsJs(){
  return new Promise((ok, fail) => {
    if (window.Hls) return ok();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
}

async function play(slug){
  const c = CHANNELS.find(x => x.slug === slug);
  if (!c) return;
  if (hls) { hls.destroy(); hls = null; }
  const box = $("player");
  const oldVideo = box.querySelector("video");          // 이전 영상 완전 정지
  if (oldVideo) { oldVideo.pause(); oldVideo.removeAttribute("src"); oldVideo.load(); }
  $("now").innerHTML = `▶ ${c.name}<small>${c.cat}</small>`;
  document.title = `${c.name} 실시간 - 실시간 TV`;

  if (c.type === "youtube" || c.type === "youtube-live") {
    const src = c.type === "youtube"
      ? `https://www.youtube.com/embed/${c.id}?autoplay=1&mute=1&playsinline=1`
      : `https://www.youtube.com/embed/live_stream?channel=${c.id}&autoplay=1&mute=1&playsinline=1`;
    box.innerHTML = `<iframe src="${src}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  } else if (c.type === "link") {
    box.innerHTML = `<div class="empty" style="flex-direction:column;gap:12px">
      <div>${c.name}은(는) 방송사 공식 플레이어에서 재생됩니다</div>
      <a href="${c.url}" target="_blank" rel="noopener" style="color:#fff;background:#e5384f;padding:10px 18px;border-radius:8px;text-decoration:none">KBS 온에어에서 보기 ↗</a></div>`;
  } else if (c.type === "hls") {
    box.innerHTML = `<video id="v" controls autoplay muted playsinline></video>`;
    const v = $("v");
    try { await loadHlsJs(); } catch(e) {}
    if (c.slug !== location.hash.slice(1) && location.hash) return;   // 그 사이 다른 채널을 눌렀으면 중단
    if (window.Hls && Hls.isSupported()) {                 // 크롬·엣지·안드로이드: hls.js
      hls = new Hls({ lowLatencyMode:true });
      hls.on(Hls.Events.ERROR, (ev, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      });
      hls.loadSource(c.url); hls.attachMedia(v);
    } else if (v.canPlayType("application/vnd.apple.mpegurl")) {   // 아이폰·사파리: 기본 재생
      v.src = c.url;
    } else {
      box.innerHTML = `<div class="empty">이 브라우저는 HLS를 지원하지 않습니다</div>`;
    }
  }
  renderGrid();
  window.scrollTo({ top:0, behavior:"smooth" });
}

// 이벤트
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  currentCat = b.dataset.cat; renderTabs(); renderGrid();
});
$("grid").addEventListener("click", e => {
  const f = e.target.closest("[data-fav]");
  if (f) {
    const s = f.dataset.fav;
    favs = favs.includes(s) ? favs.filter(x => x !== s) : [...favs, s];
    saveFavs(); renderGrid(); return;
  }
  const card = e.target.closest(".card");
  if (card) location.hash = card.dataset.slug;   // 주소: 페이지#ytn
});
window.addEventListener("hashchange", () => play(location.hash.slice(1)));

renderTabs(); renderGrid();
if (location.hash) play(location.hash.slice(1));
</script>
</body>
